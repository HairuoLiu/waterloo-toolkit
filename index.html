<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滑铁卢大学工具箱 · UW Toolkit</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">🎓 滑铁卢大学工具箱</a>
    <div class="top-actions">
      <a class="icon-btn" href="https://github.com/HairuoLiu/waterloo-toolkit" target="_blank" rel="noopener" aria-label="在 GitHub 查看源码" title="在 GitHub 查看源码">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.7 18 5 18 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      </a>
      <button class="icon-btn" id="share-btn" aria-label="分享此页面" title="分享此页面">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>滑铁卢大学 · 小工具集合</h1>
      <p class="sub">面向滑铁卢大学学生(以研究生为主)的轻量工具，无后端、免登录，开源可改。</p>
    </section>

    <section>
      <div id="app-grid" class="grid">
        <p class="muted">加载中…</p>
      </div>
    </section>

    <footer class="foot">
      <p>每个工具都是一个独立子页面，点击卡片进入。命名规范与封面制作见仓库内
        <a href="README.md">README.md</a>（含 <a href="STRUCTURE.md">STRUCTURE.md</a>）。</p>
    </footer>
  </main>

  <script>
    fetch('apps/manifest.json')
      .then(function (r) { return r.json(); })
      .then(function (apps) {
        var grid = document.getElementById('app-grid');
        grid.innerHTML = '';
        if (!apps.length) {
          grid.innerHTML = '<p class="muted">还没有子工具，欢迎按 STRUCTURE.md 添加。</p>';
          return;
        }
        apps.forEach(function (a) {
          var card = document.createElement('a');
          card.className = 'app-card';
          card.href = a.path;
          var cover = a.cover
            ? '<img class="cover" src="' + a.cover + '" alt="' + (a.title_zh || a.id) + ' 封面" loading="lazy" />'
            : '<div class="icon">' + (a.icon || '🔧') + '</div>';
          card.innerHTML =
            cover +
            '<h3>' + (a.title_zh || a.title_en || a.id) + '</h3>' +
            '<p>' + (a.desc_zh || a.desc_en || '') + '</p>' +
            (a.category ? '<span class="tag">' + a.category + '</span>' : '');
          grid.appendChild(card);
        });
      })
      .catch(function (e) {
        document.getElementById('app-grid').innerHTML =
          '<p class="muted">清单加载失败（本地直接打开时请用本地服务器预览）。' + e + '</p>';
      });
  </script>

  <div class="toast" id="toast" hidden></div>
  <script>
    (function () {
      var sb = document.getElementById('share-btn');
      function toast(m) {
        var t = document.getElementById('toast'); if (!t) return;
        t.textContent = m; t.hidden = false; clearTimeout(toast._t);
        toast._t = setTimeout(function () { t.hidden = true; }, 1800);
      }
      function copy(u) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(u);
        var ta = document.createElement('textarea'); ta.value = u; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); return Promise.resolve();
      }
      if (sb) sb.addEventListener('click', function () {
        var d = { title: '滑铁卢大学工具箱', text: '滑铁卢大学工具箱 · UW Toolkit', url: location.href };
        if (navigator.share) { navigator.share(d).catch(function () {}); }
        else { copy(location.href).then(function () { toast('链接已复制，去分享吧'); }); }
      });
    })();
  </script>
</body>
</html>
