<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO: Open Graph / Twitter（静态英文，供爬虫与分享卡片） -->
    <meta property="og:title" content="UW Grad Important Dates · Calendar" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/" />
    <meta property="og:image" content="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/cover.svg" />
    <meta name="twitter:card" content="summary" />
  <meta name="description" content="One thing to do each day with action tips, from UW graduate important dates. Month calendar + list views, bilingual, copy-ready for group chat." />
  <title data-i18n="dr.title">UW Grad Important Dates · Calendar</title>
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/i18n.css" />
  <!-- SEO: canonical + hreflang（zh 变体 = ?lang=zh，客户端切换；x-default 指向英文） -->
    <link rel="canonical" href="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/" />
    <link rel="alternate" hreflang="en" href="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/" />
    <link rel="alternate" hreflang="zh" href="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/?lang=zh" />
    <link rel="alternate" hreflang="x-default" href="https://hairuoliu.github.io/waterloo-toolkit/apps/daily-reminder/" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html" data-i18n-attr="aria-label:dr.back" aria-label="Back to UW Toolkit">
      <span class="uw-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="#FED34C"/>
          <path d="M9 22 L13 10 L16 18 L19 10 L23 22" fill="none" stroke="#1f2430" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-text" data-i18n="dr.brand">UW Grad Important Dates</span>
    </a>
    <div class="top-actions">
      <a class="icon-btn" href="https://github.com/HairuoLiu/waterloo-toolkit/tree/master/apps/daily-reminder" target="_blank" rel="noopener" data-i18n-attr="aria-label:dr.nav.github,title:dr.nav.github" aria-label="View source on GitHub" title="View source on GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.7 18 5 18 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      </a>
      <button class="icon-btn" id="share-btn" data-i18n-attr="aria-label:dr.share.aria,title:dr.share.aria" aria-label="Share this page" title="Share this page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <!-- 顶部提醒中心：今日 / 本周 / 本月（每 tab 自带复制） -->
    <section class="remind-hub">
      <div class="remind-tabs">
        <button class="rtab active" data-range="today" data-i18n="dr.remind.today">Today</button>
        <button class="rtab" data-range="week" data-i18n="dr.remind.week">This Week</button>
        <button class="rtab" data-range="month" data-i18n="dr.remind.month">This Month</button>
      </div>
      <div class="remind-hint" id="remind-hint"></div>
      <button class="remind-copy" id="remind-copy" type="button" data-i18n="dr.copy.today">📋 Copy today's text</button>
    </section>

    <!-- 主区：日历 / 列表 -->
    <section class="view-main">
      <!-- 浮动类别筛选：与日历同一容器，浮于日历右上角 -->
      <button class="cat-fab" id="cat-fab" data-i18n-attr="aria-label:dr.cat.fab,title:dr.cat.fab" aria-label="Filter by category" title="Filter by category">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="cat-fab-dot" id="cat-fab-dot"></span>
      </button>
      <div class="cat-pop" id="cat-pop" hidden>
        <div class="cat-pop-head">
          <span data-i18n="dr.cat.title">Filter by Category</span>
          <button class="cat-pop-close" id="cat-pop-close" data-i18n-attr="aria-label:dr.cat.close" aria-label="Close">×</button>
        </div>
        <div id="cat-pop-list" class="cat-pop-list"></div>
      </div>

      <div class="view-head">
        <span class="year-badge" id="year-badge">2026–2027 Academic Year</span>
        <div class="view-tabs">
          <button class="tab active" data-view="calendar" data-i18n="dr.view.calendar">Calendar</button>
          <button class="tab" data-view="list" data-i18n="dr.view.list">List</button>
        </div>
      </div>

      <section id="calendar-view" class="cal-section">
        <div class="cal-nav">
          <button id="cal-prev" class="btn ghost" data-i18n="dr.cal.prev">‹ Prev</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="btn ghost" data-i18n="dr.cal.next">Next ›</button>
          <button id="cal-this" class="btn ghost today-pill" data-i18n="dr.cal.today">Today</button>
        </div>
        <div class="cal-grid">
          <div class="cal-dow-row">
            <span data-i18n="dr.dow.0">Sun</span><span data-i18n="dr.dow.1">Mon</span><span data-i18n="dr.dow.2">Tue</span><span data-i18n="dr.dow.3">Wed</span><span data-i18n="dr.dow.4">Thu</span><span data-i18n="dr.dow.5">Fri</span><span data-i18n="dr.dow.6">Sat</span>
          </div>
          <div id="cal-cells" class="cal-cells"></div>
        </div>
      </section>

      <section id="list-view" class="table-section" style="display:none">
        <div class="table-head">
          <h2><span data-i18n="dr.table.title">All Important Dates</span> <span id="table-count" class="muted"></span></h2>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th data-i18n="dr.th.date">Date</th><th data-i18n="dr.th.event">Event</th><th data-i18n="dr.th.cat">Category</th><th data-i18n="dr.th.term">Term</th><th data-i18n="dr.th.action">Recommended Action</th></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>
    </section>

    <footer class="foot">
      <p><span data-i18n="dr.footer.pre">This tool aggregates information; always confirm with the</span>
        <a href="https://uwaterloo.ca/important-dates/graduate" target="_blank" rel="noopener" data-i18n="dr.footer.link">official university page</a><span data-i18n="dr.footer.tail">.</span></p>
    </footer>
  </main>

  <!-- 日期详情模态 -->
  <div class="detail-backdrop" id="detail-backdrop">
    <div class="detail-modal" id="detail-modal" role="dialog" aria-modal="true">
      <button class="detail-close" id="detail-close" data-i18n-attr="aria-label:dr.detail.close" aria-label="Close">×</button>
      <div id="cal-detail"></div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="../../assets/i18n.js"></script>
  <script src="../../assets/i18n/daily-reminder.js"></script>
  <script>UW_I18N.mountToggle(); UW_I18N.apply(document);</script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
